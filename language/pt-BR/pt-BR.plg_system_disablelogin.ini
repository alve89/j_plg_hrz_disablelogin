PLG_HRZ_DISABLELOGIN = "Sistema - Desabilitar Login"
PLG_HRZ_DISABLELOGIN_DESCRIPTION = "Plugin para desabilitar usuários / logins no frontend"

PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_LABEL = "Ativar registro de log"
PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_DESC = "Com o registro de log ativado, todos os endereços verificados e seus status são registrados no arquivo <strong>plg_hrz_disablelogin.log.php</strong>. O caminho do arquivo de log é o caminho global do Joomla-Logs."
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_LABEL = "Mostrar negação de acesso no frontend"
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_DESC = "O visitante recebe uma mensagem informando que o acesso à página (desativada) foi negado (se a chave secreta não foi fornecida)."
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_LABEL = "Endereço de destino caso o acesso seja bloqueado"
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_DESC = "O visitante será redirecionado para este site se tentar acessar uma página e for negado o acesso (sem a chave secreta).<br />Opções possíveis:<ul><li><strong>Padrão</strong> (se o campo ficar vazio): Página inicial (provavelmente http://myDomain.tld/my/joomla)</li><li>http://myDomain.tld/path/to/joomla<code>/my/targetaddress</code> </li><li><code>http://completeAddress.tld/further/path</code></li></ul>"

PLG_HRZ_DISABLELOGIN_MESSAGE_ERROR_ACCESS_DENIED = "Acesso negado"
PLG_HRZ_DISABLELOGIN_MESSAGE_WARNING_NO_SECRET = "O plugin <i>Sistema - Desabilitar Login</i> está ativado, mas nenhuma chave secreta está configurada. Desative o plugin ou defina uma chave secreta!"

PLG_HRZ_DISABLELOGIN_LOG_MSG_BLOCKED = "Endereço bloqueado: "
PLG_HRZ_DISABLELOGIN_LOG_MSG_NOT_BLOCKED = "Endereço não bloqueado: "

PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_PLACEHOLDER = "thisIsMySecret123"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_LABEL = "Chave Secreta"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_DESC = "Esta chave permite o acesso ao login no frontend. Adicione a chave secreta ao seu endereço da seguinte forma:<br/>https://domain.tld/path/to/Joomla/<code>?thisIsMySecret123</code> ou , se outro parâmetro GET já for usado, https://domain.tld/path/to/Joomla/?otherParameter=1<code>&thisIsMySecret123</code>. Após a validação, o acesso permanece liberado para a sessão atual.<br/><strong>Use um valor longo, aleatório e difícil de adivinhar</strong> (ex.: 20+ caracteres aleatórios) - esta chave é a única barreira entre os visitantes e o formulário de login."

PLG_HRZ_DISABLELOGIN_FIELDSET_HARDENING_LABEL = "Reforço de segurança"

PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_LABEL = "Manter acesso desbloqueado durante toda a sessão"
PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_DESC = "Se ativado (padrão), a chave secreta só precisa ser informada uma vez por sessão do visitante. Se desativado, a chave deve ser informada em cada requisição - mais restritivo, porém menos conveniente."

PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_LABEL = "Bloquear também a API de Web Services"
PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_DESC = "A API de Web Services do Joomla (/api) pode autenticar usuários de forma independente do formulário de login do frontend (ex.: via HTTP Basic Auth) e, portanto, NÃO é coberta por este plugin por padrão. Ao ativar, toda a API é bloqueada para quem não tiver a chave secreta ou um IP permitido. Ative apenas se a API não for necessária para outros fins, ou proteja-a separadamente."

PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_LABEL = "Endereços IP sempre permitidos"
PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_DESC = "Lista opcional de endereços IP ou intervalos CIDR (um por linha, ex.: 203.0.113.4 ou 198.51.100.0/24) que ignoram completamente este plugin - útil para um endereço de escritório ou VPN. Deixe em branco para desativar."
