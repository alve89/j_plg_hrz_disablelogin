PLG_HRZ_DISABLELOGIN = "System - Disable Login"
PLG_HRZ_DISABLELOGIN_DESCRIPTION = "Plugin zum Deaktivieren von Benutzeranmeldungen und com_users-Zugriffen im Frontend"

PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_LABEL = "Logging aktivieren"
PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_DESC = "Bei aktiviertem Logging werden die geprüften Adressen inklusive Status in der Datei <strong>plg_hrz_disablelogin.log.php</strong> gespeichert. Zugangsschlüssel werden dabei aus der protokollierten URL entfernt. Der Dateispeicherort entspricht dem globalen Joomla-Logs-Pfad."
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_LABEL = "Zugriffsverweigerung im Frontend anzeigen"
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_DESC = "Beim Aufruf einer gesperrten Seite ohne gültigen geheimen Schlüssel wird ein Hinweis angezeigt, dass der Zugriff verweigert wurde."
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_LABEL = "Ziel-Adresse bei Zugriffsverweigerung"
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_DESC = "Auf diese Adresse wird bei einem gesperrten Zugriff weitergeleitet. Leer = Joomla-Startadresse. Relative Pfade wie <code>/hinweis</code> werden relativ zum Joomla-Stammverzeichnis aufgelöst. Alternativ kann eine vollständige HTTP- oder HTTPS-Adresse angegeben werden."

PLG_HRZ_DISABLELOGIN_MESSAGE_ERROR_ACCESS_DENIED = "Zugriff verweigert"
PLG_HRZ_DISABLELOGIN_MESSAGE_WARNING_NO_SECRET = "Das Plugin <i>System - Disable Login</i> ist aktiviert, es wurde jedoch kein geheimer Schlüssel konfiguriert. Aus Sicherheitsgründen sollte entweder ein Schlüssel konfiguriert oder das Plugin deaktiviert werden."

PLG_HRZ_DISABLELOGIN_LOG_MSG_BLOCKED = "Adresse geblockt: "
PLG_HRZ_DISABLELOGIN_LOG_MSG_NOT_BLOCKED = "Adresse nicht geblockt: "

PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_PLACEHOLDER = "dasIstMeinSecret123"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_LABEL = "Geheimer Schlüssel"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_DESC = "Dieser Schlüssel ermöglicht den Zugriff zum Anmelden im Frontend. Füge der Adresse den Schlüssel wie folgt hinzu:<br/>https://domain.tld/Pfad/zu/Joomla/<code>?dasIstMeinSecret123</code> oder, wenn bereits andere GET-Parameter übergeben werden, https://domain.tld/Pfad/zu/Joomla/?andererParameter=1<code>&dasIstMeinSecret123</code>. Nach erfolgreicher Freigabe gilt der Zugriff für die aktuelle Sitzung. Eine Änderung des konfigurierten Schlüssels macht bestehende Freigaben ungültig.<br/><strong>Verwende einen langen, zufälligen, schwer zu erratenden Wert</strong> (z. B. 20+ zufällige Zeichen) - dieser Schlüssel ist die einzige Hürde zwischen Besuchern und dem Login-Formular."

PLG_HRZ_DISABLELOGIN_FIELDSET_HARDENING_LABEL = "Absicherung"

PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_LABEL = "Zugriff für die gesamte Session freigeschaltet lassen"
PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_DESC = "Bei aktivierter Option (Standard) muss der geheime Schlüssel nur einmal pro Besuchersession angegeben werden. Bei deaktivierter Option muss der Schlüssel bei jeder einzelnen Anfrage mitgegeben werden - strenger, aber unkomfortabler."

PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_LABEL = "Auch die Web-Services-API blockieren"
PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_DESC = "Die Joomla Web-Services-API (/api) kann Benutzer unabhängig vom Frontend-Login-Formular authentifizieren (z. B. per HTTP Basic Auth) und wird daher standardmäßig NICHT von diesem Plugin erfasst. Bei Aktivierung wird die gesamte API für alle ohne gültigen Schlüssel oder erlaubte IP-Adresse gesperrt. Nur aktivieren, wenn die API nicht anderweitig benötigt wird, oder sie separat absichern."

PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_LABEL = "Immer erlaubte IP-Adressen"
PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_DESC = "Optionale Liste von IP-Adressen oder CIDR-Bereichen (eine pro Zeile, z. B. 203.0.113.4 oder 198.51.100.0/24), die dieses Plugin vollständig umgehen dürfen - nützlich für eine Büro- oder VPN-Adresse. Leer lassen, um die Funktion zu deaktivieren."
