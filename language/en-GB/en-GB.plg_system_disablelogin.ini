PLG_HRZ_DISABLELOGIN = "System - Disable Login"
PLG_HRZ_DISABLELOGIN_DESCRIPTION = "Plugin to disable frontend user logins and access to com_users"

PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_LABEL = "Enable Logging"
PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_DESC = "When logging is enabled, checked addresses and their status are written to <strong>plg_hrz_disablelogin.log.php</strong>. Access credentials are removed from logged URLs. The file is stored in Joomla's configured log directory."
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_LABEL = "Show access denial in frontend"
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_DESC = "Displays an access denied message when a blocked page is requested without a valid secret key."
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_LABEL = "Target address on blocked access"
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_DESC = "Visitors are redirected to this address when access is blocked. Empty = Joomla root URL. Relative paths such as <code>/notice</code> are resolved relative to the Joomla root. A complete HTTP or HTTPS URL can also be used."

PLG_HRZ_DISABLELOGIN_MESSAGE_ERROR_ACCESS_DENIED = "Access denied"
PLG_HRZ_DISABLELOGIN_MESSAGE_WARNING_NO_SECRET = "The plugin <i>System - Disable Login</i> is enabled but no secret key is configured. For security, configure a key or disable the plugin."

PLG_HRZ_DISABLELOGIN_LOG_MSG_BLOCKED = "Address blocked: "
PLG_HRZ_DISABLELOGIN_LOG_MSG_NOT_BLOCKED = "Address not blocked: "

PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_PLACEHOLDER = "thisIsMySecret123"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_LABEL = "Secret Key"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_DESC = "This key enables access to the login in frontend. Add the secret to your address as follows:<br/>https://domain.tld/path/to/Joomla/<code>?thisIsMySecret123</code> or, if already other GET-parameter are used, https://domain.tld/path/to/Joomla/?otherParameter=1<code>&thisIsMySecret123</code>. After successful validation, access is granted for the current session. Changing the configured secret invalidates existing grants.<br/><strong>Use a long, random, hard-to-guess value</strong> (e.g. 20+ random characters) - this key is the only thing standing between visitors and the login form."

PLG_HRZ_DISABLELOGIN_FIELDSET_HARDENING_LABEL = "Hardening"

PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_LABEL = "Keep access unlocked for the whole session"
PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_DESC = "If enabled (default), the secret key only has to be provided once per visitor session. If disabled, the secret key must be provided with every single request, which is stricter but less convenient."

PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_LABEL = "Also block the Web Services API"
PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_DESC = "Joomla's Web Services API (/api) can authenticate users independently of the frontend login form (e.g. via HTTP Basic Auth) and is therefore NOT covered by this plugin unless enabled here. Enabling this blocks the entire API for anyone without the secret key or an allow-listed IP address. Only enable this if you are not relying on the API for other purposes, or protect it separately."

PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_LABEL = "Always-allowed IP addresses"
PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_DESC = "Optional list of IP addresses or CIDR ranges (one per line, e.g. 203.0.113.4 or 198.51.100.0/24) that bypass this plugin entirely - useful for an office or VPN address. Leave empty to disable."
