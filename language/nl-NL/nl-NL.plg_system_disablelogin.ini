PLG_HRZ_DISABLELOGIN             = "Systeem - blokkeer website inloggen"
PLG_HRZ_DISABLELOGIN_DESCRIPTION = "Plugin om website inloggen te blokkeren"

PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_LABEL = "Activeer logging"
PLG_HRZ_DISABLELOGIN_FIELD_ENABLELOGGING_DESC = "Met activeren logging worden alle inlog pogingen en hun status gelogd in een log bestand <strong>plg_hrz_disablelogin.log.php</strong>. het log bestand is te vinden in de globale logs folder instelling."
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_LABEL = "Toon toegang geweigerd melding op de website"
PLG_HRZ_DISABLELOGIN_FIELD_MESSAGEOUTPUT_DESC = "De bezoeker krijgt een melding dat inloggen is geblokkeerd (als de geheime sleutel niet is opgegeven)."
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_LABEL = "Doeladres bij geweigerde toegang"
PLG_HRZ_DISABLELOGIN_FIELD_REDIRECTURL_DESC = "De bezoeker wordt naar dit adres doorgestuurd wanneer de toegang wordt geweigerd. Leeg = Joomla-hoofdadres. Relatieve paden zoals <code>/melding</code> worden herleid tot het Joomla-hoofdadres. Er kan ook een volledige HTTP- of HTTPS-URL worden opgegeven."

PLG_HRZ_DISABLELOGIN_MESSAGE_ERROR_ACCESS_DENIED = "Toegang geweigerd"
PLG_HRZ_DISABLELOGIN_MESSAGE_WARNING_NO_SECRET   = "De plugin <i>System - Disable Login</i> is geactiveerd maar er is geen geheime sleutel geconfigureerd. deactiveer de pluging of vul een geheime sleutel in!"

PLG_HRZ_DISABLELOGIN_LOG_MSG_BLOCKED = "Adres is gebokkeerd: "
PLG_HRZ_DISABLELOGIN_LOG_MSG_NOT_BLOCKED = "Adres is niet geblokkeerd: "

PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_PLACEHOLDER = "ditisdegeheimesleutel123"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_LABEL = "Geheime sleutel"
PLG_HRZ_DISABLELOGIN_FIELD_SECRETKEY_DESC = "met deze geheime sleutel maakt het mogelijk om in te loggen op de website. Voeg hiervoor de geheime sleutel toe aan de url:<br/>https://domain.tld/path/to/Joomla/<code>?ditisdegeheimesleutel123</code> of, indien er al een parameter is opgegeven in de url vul deze aan met <code>&ditisdegeheimesleutel123</code>. Na succesvolle controle blijft de toegang geldig voor de huidige sessie.<br/><strong>Gebruik een lange, willekeurige, moeilijk te raden waarde</strong> (bijv. 20+ willekeurige tekens) - deze sleutel is de enige barrière tussen bezoekers en het inlogformulier."

PLG_HRZ_DISABLELOGIN_FIELDSET_HARDENING_LABEL = "Beveiliging"

PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_LABEL = "Toegang voor de hele sessie ontgrendeld houden"
PLG_HRZ_DISABLELOGIN_FIELD_PERSISTUNLOCK_DESC = "Indien ingeschakeld (standaard) hoeft de geheime sleutel maar één keer per bezoekerssessie te worden opgegeven. Indien uitgeschakeld moet de sleutel bij elk verzoek worden meegegeven - strenger, maar minder gebruiksvriendelijk."

PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_LABEL = "Ook de Web Services API blokkeren"
PLG_HRZ_DISABLELOGIN_FIELD_BLOCKAPI_DESC = "De Joomla Web Services API (/api) kan gebruikers onafhankelijk van het frontend inlogformulier authenticeren (bijv. via HTTP Basic Auth) en wordt daarom standaard NIET door deze plugin gedekt. Bij inschakelen wordt de volledige API geblokkeerd voor iedereen zonder geldige sleutel of toegestaan IP-adres. Alleen inschakelen als de API niet elders nodig is, of afzonderlijk beveiligen."

PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_LABEL = "Altijd toegestane IP-adressen"
PLG_HRZ_DISABLELOGIN_FIELD_ALLOWEDIPS_DESC = "Optionele lijst met IP-adressen of CIDR-bereiken (één per regel, bijv. 203.0.113.4 of 198.51.100.0/24) die deze plugin volledig omzeilen - handig voor een kantoor- of VPN-adres. Leeg laten om uit te schakelen."
